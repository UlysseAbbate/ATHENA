<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUCIEN</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/libby.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../shared/tables.css">
<script src="../shared/theme.js"></script>
<script src="../shared/refresh-all.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="hd"></header>
<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-tab="all" class="on">Everything</button>
  <button data-tab="committee">Select committees</button>
  <button data-tab="thinktank">Think tanks</button>
  <button data-tab="media">Lib Dems in the media</button>
  <button data-tab="polling">Polling</button>
  <button data-tab="economy">Economic policy</button>
  <button data-tab="archive">Archive</button>
  <button data-tab="statscal">Stats calendar</button>
  <button data-tab="health">Source health</button>
</nav>

<div class="wrap"><div class="page-head" id="pt"><h1>Everything</h1></div></div>
<main id="main" tabindex="-1">
  <section id="pollpanel" hidden>
    <div class="panel" id="pollsters"></div>
  </section>

  <section id="overview" class="overview">
    <div id="stats" class="stats"></div>
    <div class="charts">
      <div class="panel"><div class="panel-head"><h2>Publishing activity</h2><span class="muted" id="actnote"></span></div><div class="chartwrap"><svg id="activity" viewBox="0 0 520 170" role="img" aria-label="Items published per day"></svg><div id="atip" class="tip" hidden></div></div><div id="alegend" class="legend"></div></div>
      <div class="panel"><div class="panel-head"><h2>By policy area</h2><span class="muted">click to filter</span></div><div id="areabars" class="bars"></div></div>
    </div>
  </section>

  <section id="controls" class="controls">
    <input id="q" type="search" placeholder="Search titles, sources, topics…  ( / )" aria-label="Search">
    <select id="area" aria-label="Policy area"></select>
    <select id="geo" aria-label="Geography"></select>
    <select id="kind" aria-label="Type"></select>
    <select id="source" aria-label="Source"></select>
    <select id="house" aria-label="House" hidden></select>
    <select id="range" aria-label="Date range">
      <option value="2">Last 2 days</option>
      <option value="7" selected>Last 7 days</option>
      <option value="30">Last 30 days</option>
      <option value="180">Last 180 days (older: Archive)</option>
    </select>
    <select id="status" aria-label="Read status">
      <option value="">All</option>
      <option value="unread">Unread</option>
      <option value="read">Read</option>
    </select>
    <label class="chk"><input id="onlyNew" type="checkbox"> New only</label>
    <label class="chk" id="sinceLastWrap" hidden><input id="sinceLast" type="checkbox"> Since my last visit</label>
    <button id="reset" class="ghost" type="button">Reset</button>
  </section>

  <div class="listhead"><span id="count" class="muted"></span><button id="markall" class="ghost" type="button">Mark all shown as read</button></div>
  <div id="list" class="list"></div>
  <section id="statspanel" hidden></section>
  <section id="archivepanel" hidden></section>
  <section id="economypanel" hidden></section>
  <section id="healthpanel" hidden></section>
  <section id="teampanel" hidden></section>
</main>
<div id="toast" class="toast" hidden></div>
<script src="../shared/vendor/supabase.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/common.js"></script>
<script src="../shared/shell.js"></script>
<script src="../shared/authui.js"></script>
<script src="../shared/tables.js"></script>
<script src="../shared/dropdowns.js"></script>
<script src="../shared/teampage.js"></script>
<script src="header.js"></script>
<script src="statscal.js"></script>
<script src="archive.js"></script>
<script src="econ-profile.js"></script>
<script src="economy.js"></script>
<script src="app.js"></script>
</body>
</html>
