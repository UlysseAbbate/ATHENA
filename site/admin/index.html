<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../athena.css">
<style>
main{max-width:720px;margin:0 auto;padding:34px 16px 60px}
h2{margin:30px 0 8px;font-size:1.05rem}
nav.go{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 4px}
nav.go a{padding:14px 24px;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);text-decoration:none;font:800 1.05rem var(--head);min-width:170px;background:var(--card);transition:box-shadow .15s,border-color .15s,transform .15s}
nav.go a:hover{box-shadow:var(--shadow-hover);border-color:var(--yellow-deep);transform:translateY(-1px)}
table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}td.n{text-align:right;font-weight:700;white-space:nowrap}tr:last-child td{border-bottom:0}
.alert{padding:11px 14px;border:1px solid var(--line);border-left:5px solid var(--red);border-radius:8px;background:var(--card);margin:14px 0;font-size:14px}
.alert.ok{border-left-color:var(--green)}
small.why{display:block;color:var(--muted);font-size:12px;margin-top:2px;overflow-wrap:anywhere}
.act td{font-size:12.5px}
</style>
</head>
<body><header class="masthead"><div class="wrap masthead-bar"><h1 class="brand">Admin</h1><div class="right"><a class="muted" href="../">Home</a></div></div></header>
<main id="m"></main>
<script src="../mall/vendor/supabase.js"></script>
<script src="../mall/config.js"></script>
<script src="../common.js"></script>
<script src="../mall/authui.js"></script>
<script src="admin.js"></script>
</body>
</html>
