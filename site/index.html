<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athena</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#faf8f3;--card:#fff;--ink:#1d2330;--muted:#6b7280;--line:#e6e1d6;--accent:#f59e0b;--accent2:#7c3aed}
@media (prefers-color-scheme:dark){:root{--bg:#14161c;--card:#1c1f27;--ink:#eceae4;--muted:#9aa0ab;--line:#2c303a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Iowan Old Style",serif}
main{width:100%;max-width:760px;padding:32px 16px;text-align:center}
h1{margin:0 0 6px;font-size:2rem;letter-spacing:.2em}
p.sub{margin:0 0 32px;color:var(--muted);font:14px system-ui,sans-serif}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.btns{grid-template-columns:1fr}}
a.btn{display:block;padding:36px 20px;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;color:var(--ink);text-decoration:none}
a.btn:hover,a.btn:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.btn b{display:block;font-size:1.6rem;letter-spacing:.14em}
.btn span{display:block;margin-top:8px;color:var(--muted);font:14px system-ui,sans-serif}
</style>
</head>
<body>
<main>
  <h1>ATHENA</h1>
  <p class="sub">Choose a workspace</p>
  <div class="btns">
    <a class="btn" style="--c:var(--accent)" href="ulysse/"><b>ULYSSE</b><span>Policy tracker: select committees, think tanks, Lib Dems in the media, polling</span></a>
    <a class="btn" style="--c:var(--accent2)" href="mall/"><b>THE MALL</b><span>Mayoral Analysis for London's Liberals. Sign-in required</span></a>
  </div>
</main>
</body>
</html>
