<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athena</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#fff;--ink:#111}
@media (prefers-color-scheme:dark){:root{--bg:#111;--ink:#f2f2f2}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:13px/1 system-ui,-apple-system,"Segoe UI",sans-serif}
nav{display:flex;gap:16px;padding:16px;flex-wrap:wrap;justify-content:center}
a{display:block;min-width:200px;padding:18px 28px;border:1px solid var(--ink);color:var(--ink);text-decoration:none;text-align:center;letter-spacing:.2em}
a:hover,a:focus-visible{background:var(--ink);color:var(--bg);outline:none}
</style>
</head>
<body>
<nav id="n"><a href="mall/">THE MALL</a></nav>
<script src="mall/vendor/supabase.js"></script>
<script src="mall/config.js"></script>
<script>
// The ULYSSE button is only added for the signed-in admin. The data behind it is protected server-side regardless.
(async () => {
  try {
    const sb = window.supabase.createClient(MALL_CONFIG.url, MALL_CONFIG.key, { auth: { persistSession: true } });
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return;
    const { data: admin } = await sb.rpc("is_admin");
    if (admin) document.getElementById("n").insertAdjacentHTML("afterbegin", '<a href="ulysse/">ULYSSE</a>');
  } catch (e) {}
})();
</script>
</body>
</html>
