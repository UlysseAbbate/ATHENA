# Checks the whole site on every commit (on any branch) and every pull request, and turns a red cross on GitHub if something is wrong
# (a missing file, a broken import, a page with no file, a route that saves data without an access check, ...).
# The same check can be run by hand with:  node scripts/libby/check-site.mjs
name: Check site

on:
  push:            # every branch, so a change can be checked before it is merged
  pull_request:
  workflow_dispatch:

# the jobs only read the repository; nothing here can push, tag or change settings
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check the site
        run: node scripts/libby/check-site.mjs
      - name: Check the Today's List PDF reader and the estimated times
        run: node scripts/libby/check-list.mjs
      - name: Check the legislation.gov.uk readers (secondary legislation tracker)
        run: node scripts/libby/check-legislation.mjs
      - name: Check the Update Word document
        run: node scripts/libby/check-update-doc.mjs
      - name: Check the Parliamentary process readers and answers
        run: node scripts/libby/check-process.mjs
      - name: Check the spreadsheet import (headings, dates, roles, the rows it accepts and refuses)
        run: node scripts/libby/check-import.mjs
      - name: Check sign-in, the guessing throttle and the security headers
        run: node scripts/libby/check-access.mjs
      - name: Check how Lords business rows become a day
        run: node scripts/libby/check-business.mjs
      - name: Check the shortened place in the Bill
        run: node scripts/libby/check-amendments.mjs
