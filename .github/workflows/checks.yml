name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint collector
        run: python -m pyflakes tracker tests
      - name: Collector tests (offline)
        run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript syntax
        run: for f in site/*.js site/*/*.js; do node --check "$f"; done
      - name: Browser tests (mocked database, real security headers)
        run: |
          npm install --no-save --no-package-lock playwright@1.47.2
          npx playwright install --with-deps chromium
          node tests/ui/run.js
