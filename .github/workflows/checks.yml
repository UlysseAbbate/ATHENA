name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint collector
        run: python -m pyflakes tracker tests
      - name: Collector tests (offline)
        run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript syntax
        run: for f in site/*.js site/*/*.js; do node --check "$f"; done
      - name: Database rules (migrations on a throwaway Postgres)
        run: bash tests/db/run.sh
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
      - name: Design tokens (contrast, light and dark)
        run: node tests/contrast.js && node tests/libby-css.js
      - name: Browser tests (mocked database, real security headers)
        run: |
          npm install --no-save --no-package-lock playwright@1.47.2
          npx playwright install --with-deps chromium
          node tests/ui/run.js
