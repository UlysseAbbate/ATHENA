# Loads the Lords Whips' Office Forthcoming Business (PDF) into Supabase.
# Runs on sitting-day mornings and after lunch; can also be run by hand (Actions → Run workflow).
name: Ingest Whips' Forthcoming Business

on:
  schedule:
    # Times are UTC. 06:30, 10:30 and 13:30 UTC ≈ 07:30, 11:30, 14:30 London in summer time.
    - cron: '30 6,10,13 * * 1-5'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/libby/requirements.txt
      - run: pip install -r scripts/libby/requirements.txt
      - name: Ingest Forthcoming Business
        working-directory: scripts/libby
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ingest_whips.py
