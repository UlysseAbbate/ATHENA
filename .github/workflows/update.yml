name: Update tracker

on:
  schedule:
    # Six wake-ups a day, around 6am and 6pm London in summer and winter time. GitHub starts scheduled runs hours late and sometimes drops one, so the
    # collector itself (tracker/update.py) checks whether the data has been renewed since the last 6am or 6pm London, and does nothing if it has.
    - cron: "7 5,6,7,17,18,19 * * *"
  workflow_dispatch:

# Read-only: the collector keeps its state in the private database (through the ingest function), not in the repo.
permissions:
  contents: read

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and upload
        run: python tracker/update.py
        env:
          INGEST_URL: https://fbsoibmtvapmxdlfdgxc.supabase.co/functions/v1/ulysse-ingest
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          ONLY_IF_DUE: ${{ github.event_name == 'schedule' && '1' || '' }}   # a timed run skips itself if the data was already renewed since 6am / 6pm
