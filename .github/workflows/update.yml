name: Update tracker

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

# Read-only: the collector keeps its state in the private database (through the ingest function), not in the repo.
permissions:
  contents: read

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and upload
        run: python tracker/update.py
        env:
          INGEST_URL: https://fbsoibmtvapmxdlfdgxc.supabase.co/functions/v1/ulysse-ingest
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
