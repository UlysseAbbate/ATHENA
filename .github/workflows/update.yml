name: Update tracker

on:
  schedule:
    # 6am and 6pm London time. GitHub's timer only knows UTC and London moves between UTC and UTC+1, so it wakes at both
    # possible times and the first step skips the run unless it is really 6am or 6pm in London.
    - cron: "23 5,6,17,18 * * *"
  workflow_dispatch:

# Read-only: the collector keeps its state in the private database (through the ingest function), not in the repo.
permissions:
  contents: read

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Is it 6am or 6pm in London?
        id: when
        run: |
          h=$(TZ=Europe/London date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$h" = "06" ] || [ "$h" = "18" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; echo "London hour is $h: not an update time, skipping"; fi
      - uses: actions/checkout@v5
        if: steps.when.outputs.go == 'true'
      - uses: actions/setup-python@v6
        if: steps.when.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.when.outputs.go == 'true'
      - name: Collect and upload
        if: steps.when.outputs.go == 'true'
        run: python tracker/update.py
        env:
          INGEST_URL: https://fbsoibmtvapmxdlfdgxc.supabase.co/functions/v1/ulysse-ingest
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
