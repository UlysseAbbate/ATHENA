# Builds and refreshes the Lib Dem policy library (conference motions and policy papers).
# Part of "Refresh data" (6am and 6pm London time), plus by hand. Unchanged documents are skipped, so later runs are quick.
name: Ingest Lib Dem policy

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Re-process every document (re-tags portfolios)'
        type: boolean
        default: false
      retag:
        description: 'Only give a portfolio to stored documents that have none (quick, no crawling)'
        type: boolean
        default: false

# the jobs only read the repository; nothing here can push, tag or change settings
permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/libby/requirements.txt
      - run: pip install -r scripts/libby/requirements.txt
      - name: Ingest policy
        working-directory: scripts/libby
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python ingest_policy.py ${{ inputs.retag && '--retag' || '' }} ${{ inputs.refresh && '--refresh' || '' }}
