# Copies House of Lords divisions (Lords Votes API) into Supabase for the Data page's Voting Data.
# It runs as a step of "Refresh data" (refresh-data.yml: 6am and 6pm London time) and can be run by hand.
# For a full rebuild, run it by hand with "since" set to 2024-07-09.
# Tick "probe" to print the shape of the Lords Votes API's replies in the log instead of loading anything.
name: Ingest Lords votes

on:
  workflow_call:
    inputs:
      since:
        description: 'Fetch everything from this date (YYYY-MM-DD). Leave blank for new divisions only.'
        type: string
        default: ''
      probe:
        description: 'Probe only: print what the Lords Votes API returns (loads nothing)'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      since:
        description: 'Fetch everything from this date (YYYY-MM-DD). Leave blank for new divisions only.'
        type: string
        default: ''
      probe:
        description: 'Probe only: print what the Lords Votes API returns (loads nothing)'
        type: boolean
        default: false

# the jobs only read the repository; nothing here can push, tag or change settings
permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/libby/requirements.txt
      - run: pip install -r scripts/libby/requirements.txt
      - name: Ingest Lords votes
        working-directory: scripts/libby
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ingest_votes.py ${{ inputs.probe && '--probe' || (inputs.since && format('--since {0}', inputs.since)) || '' }}
      - name: Ingest Commons votes
        if: ${{ !inputs.probe }}
        working-directory: scripts/libby
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ingest_commons_votes.py ${{ inputs.since && format('--since {0}', inputs.since) || '' }}
