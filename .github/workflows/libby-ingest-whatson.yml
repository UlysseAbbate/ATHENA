# Loads the UK Parliament What's On calendar into Supabase from the What's On API (scripts/libby/ingest_whatson.py).
# It runs as the first step of "Refresh data" (refresh-data.yml: 8am, 10am, 12pm, 2pm, 4pm and 6pm London time),
# and can also be run by hand from the Actions tab.
name: Ingest What's On calendar

on:
  workflow_call:
    inputs:
      days:
        description: 'How many days ahead to fetch'
        type: string
        default: '42'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days ahead to fetch'
        type: string
        default: '42'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/libby/requirements.txt
      - run: pip install -r scripts/libby/requirements.txt
      - name: Ingest What's On
        working-directory: scripts/libby
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ingest_whatson.py --days ${{ inputs.days || '42' }}
      - name: TEMPORARY - Ingest Lords Business (remove before merging)
        working-directory: scripts/libby
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ingest_lordsbusiness.py
