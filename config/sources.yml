# ---------------------------------------------------------------------------
# Source configuration for the tracker. Last verified live on 2026-10-23.
#
# committees, media and polling: checked against live responses.
# thinktanks: only the entries with a "verified" note below were checked live. The sandbox
# used for verification could only reach ~16 of the ~60 think tank hosts, so the remaining
# URLs are STILL FROM MEMORY. Check the Source health tab after the first real run and fix
# any that fail (correct the url, or add `feed:`; `feed: false` forces the HTML scrape).
#
# Verified live: Demos, CPS, ECFR, Fabian Society, Green Alliance, EPI, IEA, BFPG, FPC, CLES,
#   NEF, HJS, UK in a Changing Europe, Growth and Reform Network.
# Sources that REFUSE automated access, checked from GitHub's runners on 2026-10-24. They are respected and never worked around
# (no browser disguises, no challenge-solving); they show as failing in Source health:
#   robots.txt forbids bots: Lib Dem Voice, Reuters, The Times, BMG Research, Deltapoll, Trajectory Partnership, Good Growth Foundation,
#     UK Parliament Commons Library, Bright Blue, Centre for European Reform, NCUB, The Jobs Foundation, Re:State
#   Cloudflare bot challenge: Institute for Fiscal Studies, The King's Fund, Chatham House, Social Market Foundation,
#     Stonehaven, Redfield & Wilton, Institute for Policy Research (Bath)
#   unreachable from the runners (connection refused or timing out): Convergent Opinion, People's Polling, PolicyWISE (sometimes)
#   script-only pages with nothing to read: IISS, Merlin Strategy; Norstat's site is throttled
# Every request checks the site's robots.txt first (403/unreachable robots.txt = no bots) and requests to one site
# are spaced at least 1 second apart (longer if its Crawl-delay says so).
# ---------------------------------------------------------------------------

committees:
  # Parliament Committees API (https://committees-api.parliament.uk)
  api: https://committees-api.parliament.uk/api/Publications
  lookback_days: 30
  # Publication types to keep (matched case-insensitively as substrings).
  # Live type names: Report, Special Report, Government Response, Correspondence,
  # Formal Minutes, Engagement document, ... "report" also covers "Special Report".
  # Correspondence was ~70% of all volume, so it is left out; add it back to include letters.
  keep_types: ["report", "government response"]

media:
  # Each outlet's own RSS feeds (politics sections and Lib Dem tag pages where they exist). Google News is NOT used:
  # its robots.txt forbids bots. Every feed is checked against the outlet's robots.txt before it is read; an outlet with
  # no open feed (The Times, Reuters) or whose robots.txt refuses it shows as failing in Source health.
  # A story is kept if its headline or standfirst matches title_pattern (outlets with `all: true` are party sites and
  # keep everything). Feed URLs are best guesses where not marked verified: Source health shows which work.
  # `url:` is the outlet's page: if its feeds fail, the feeds that page advertises are tried instead.
  title_pattern: '\bLib(eral)?[ -]?Dems?\b|Liberal Democrats?|\bDavey\b|Daisy Cooper|Munira Wilson|Layla Moran|Sarah Olney|Tim Farron|Wera Hobhouse|Christine Jardine|Alistair Carmichael'
  lookback_days: 14
  outlets:
    - {name: The Guardian, feeds: ["https://www.theguardian.com/politics/liberaldemocrats/rss", "https://www.theguardian.com/politics/rss"]}
    - {name: BBC News, feeds: ["https://feeds.bbci.co.uk/news/politics/rss.xml", "https://feeds.bbci.co.uk/news/england/london/rss.xml"]}
    - {name: The Telegraph, feeds: ["https://www.telegraph.co.uk/politics/rss.xml"]}
    - {name: The Times, feeds: [], url: "https://www.thetimes.com/uk/politics"}
    - {name: The Independent, feeds: ["https://www.independent.co.uk/topic/liberal-democrats/rss", "https://www.independent.co.uk/news/uk/politics/rss"]}
    - {name: Sky News, feeds: ["https://feeds.skynews.com/feeds/rss/politics.xml"]}
    - {name: Politico Europe, feeds: ["https://www.politico.eu/section/politics/feed/", "https://www.politico.eu/feed/"]}
    - {name: Financial Times, feeds: ["https://www.ft.com/uk-politics?format=rss"]}
    - {name: The Economist, feeds: ["https://www.economist.com/britain/rss.xml"]}
    - {name: New Statesman, feeds: ["https://www.newstatesman.com/politics/feed", "https://www.newstatesman.com/feed"]}
    - {name: The Spectator, feeds: ["https://www.spectator.co.uk/feed"], url: "https://www.spectator.co.uk/"}
    - {name: PoliticsHome, feeds: ["https://www.politicshome.com/news/rss", "https://www.politicshome.com/rss"]}
    - {name: HuffPost UK, feeds: ["https://www.huffingtonpost.co.uk/feeds/index.xml"], url: "https://www.huffingtonpost.co.uk/politics/"}
    - {name: The i Paper, feeds: ["https://inews.co.uk/category/news/politics/feed"]}
    - {name: Daily Mirror, feeds: ["https://www.mirror.co.uk/news/politics/?service=rss"]}
    - {name: Daily Mail, feeds: ["https://www.dailymail.co.uk/news/liberal-democrats/index.rss", "https://www.dailymail.co.uk/news/index.rss"]}
    - {name: Daily Express, feeds: ["https://www.express.co.uk/posts/rss/139/politics"]}   # robots.txt answers 403: no bots
    - {name: City AM, feeds: ["https://www.cityam.com/category/politics/feed/"]}
    - {name: Reuters, feeds: [], url: "https://www.reuters.com/world/uk/"}
    # London and Richmond Park: mostly for Sarah Olney's coverage
    - {name: London Evening Standard, feeds: ["https://www.standard.co.uk/news/politics/rss", "https://www.standard.co.uk/news/london/rss"]}
    - {name: MyLondon, feeds: ["https://www.mylondon.news/news/?service=rss"]}
    - {name: Richmond and Twickenham Times, feeds: ["https://www.richmondandtwickenhamtimes.co.uk/news/rss/"]}
    - {name: Surrey Comet, feeds: ["https://www.surreycomet.co.uk/news/rss/"]}
    - {name: Lib Dem Voice, feeds: ["https://www.libdemvoice.org/feed"], all: true}   # robots.txt answers 403 to GitHub's runners

# Sarah Olney's coverage for Lovelace's Media page: any story in the media feeds above that names her. First the headline and
# standfirst; then, for stories from the last `article_days` that do not, the article text itself (at most `max_articles` pages per
# run, robots.txt respected). New stories are added with source "auto"; stories already logged are skipped. Social posts from the
# accounts listed on the Media page (BlueSky and Substack only) are added with source "social".
coverage:
  pattern: 'Sarah Olney|\bOlney\b'
  article_days: 2
  max_articles: 400

polling:
  # Headlines matching this are dropped: hub pages, US politics, celebrity-fame trackers.
  exclude_pattern: 'fame & popularity|polls & surveys|^topline|^insights hub|Global Market Research|^Ipsos - Ipsos|midterm|Republican|Democrat\b|generic ballot'
  # Pages that list a pollster's write-ups directly.
  direct:
    # `harvest` follows the newest matching article and adds the earlier editions it links to
    # (the listing page only shows the latest few; the topic page needs JavaScript).
    - {name: YouGov, url: "https://yougov.com/en-gb/articles", harvest: "yougov-news-tracker"}

  # POLITICAL POLLING ONLY. A search/scrape result is kept if its headline matches `core`, or matches `policy` and does not
  # look consumer/commercial; other countries' politics (`abroad`) is dropped unless the headline mentions the UK.
  political:
    core: '\b(voting intention|vote intention|westminster|general election|by-election|MRP|seat projection|nowcast|poll of polls|favourab\w*|approval|net rating|leader ratings?|best prime minister|preferred prime minister|prime minister|chancellor|leader of the opposition|conservatives?|tor(y|ies)|reform uk|reform party|lib dems?|liberal democrats?|green party|snp|plaid|restore britain|your party|labour(?! market| force| shortage| costs?)|starmer|burnham|badenoch|farage|davey|polanski|reeves|healey|swinney|sarwar|mps?|parliament\w*|government|cabinet|budget|manifesto|coalition|hung parliament|local elections?|council elections?|senedd|holyrood|elections?)\b'
    policy: '\b(immigra\w*|asylum|migrants?|small boats|brexit|EU|single market|customs union|rejoin\w*|referendum|nhs|health service|tax(es|ation)?|inheritance|pensions?|triple lock|welfare|benefits?|net zero|climate|energy bills|cost of living|inflation|housing|crime|policing|defence|nato|ukraine|israel|gaza|palestin\w*|monarchy|house of lords|electoral reform|proportional representation|voting age|votes at 16|assisted dying|rents?|landlords?|tenants?|council tax|business rates|minimum wage|nationali[sz]\w*|two[- ]child|child benefit|free school meals|death penalty|capital punishment|national service|conscription|digital id|id cards?|water (companies|bills)|thames water|free speech|devolution|independence|economy|economic|trust in|politicians?|democracy|public (opinion|attitudes)|issues facing|most important issues)\b'
    consumer: '\b(consumer\w*|brand\w*|retail\w*|shopp\w*|supermarket\w*|bingo|gambl\w*|gaming|machine games|insurance|banks?|banking|mortgage|travel\w*|holiday\w*|diet\w*|pets?|fame|celebrit\w*|football|sport\w*|streaming|tv|film|music|christmas|halloween|black friday|cyber security|asos|fashion|beauty|restaurant\w*|alcohol|coffee|cars?|broadband|omnibus|advertis\w*|smartphone|loyalty|customer\w*|product\w*|packaging|hygiene|sleep|fitness|obesity)\b'
    abroad: '\b(midterms?|republicans?|democrats?|congress|senate|generic ballot|us election|american?s?|canad\w*|alberta|quebec|BC|australia\w*|new zealand|germany|german|france|french|italy|spain|japan|india|brazil\w*|mexic\w*|argentin\w*)\b'

  # Pollsters' own sites, through the same self-healing collector as the think tanks: feed -> page -> sitemap.
  # URLs are best guesses (the sandbox these were written in could not reach most of them); Source health shows which worked.
  pollsters:
    - {name: YouGov, url: "https://yougov.com/en-gb/topics/politics/articles-reports", feeds: ["https://yougov.com/en-gb/rss/articles"]}
    - {name: Ipsos UK, url: "https://www.ipsos.com/en-uk/news-and-events", urls: ["https://www.ipsos.com/en-uk/insights-hub"]}
    - {name: More in Common, url: "https://www.moreincommon.org.uk/latest-insights/", urls: ["https://www.moreincommon.org.uk/our-work/"], feeds: ["https://www.moreincommon.org.uk/feed/"]}
    - {name: Opinium, url: "https://www.opinium.com/resource-center/", urls: ["https://www.opinium.com/political-polling/"], feeds: ["https://www.opinium.com/feed/"]}
    - {name: Survation, url: "https://www.survation.com/archive/", feeds: ["https://www.survation.com/feed/"]}
    - {name: Find Out Now, url: "https://www.findoutnow.co.uk/blog/", urls: ["https://www.findoutnow.co.uk/"], feeds: ["https://www.findoutnow.co.uk/feed/"]}
    - {name: Techne, url: "https://www.techneuk.com/", feeds: ["https://www.techneuk.com/feed/"]}
    - {name: Deltapoll, url: "https://deltapoll.co.uk/polls-library", urls: ["https://deltapoll.co.uk/"], feeds: ["https://deltapoll.co.uk/feed/"]}
    - {name: Freshwater Strategy, url: "https://freshwaterstrategy.com/", feeds: ["https://freshwaterstrategy.com/feed/"]}
    - {name: JL Partners, url: "https://www.jlpartners.co.uk/", feeds: ["https://www.jlpartners.co.uk/feed/"]}
    - {name: BMG Research, url: "https://www.bmgresearch.co.uk/category/polls/", urls: ["https://www.bmgresearch.co.uk/"], feeds: ["https://www.bmgresearch.co.uk/feed/"]}
    - {name: Focaldata, url: "https://www.focaldata.com/blog", feeds: ["https://www.focaldata.com/blog/rss.xml", "https://www.focaldata.com/feed/"]}
    - {name: Lord Ashcroft Polls, url: "https://lordashcroftpolls.com/", feeds: ["https://lordashcroftpolls.com/feed/"]}
    - {name: Savanta, url: "https://savanta.com/knowledge-centre/", feeds: ["https://savanta.com/feed/"]}
    - {name: Public First, url: "https://www.publicfirst.co.uk/research", feeds: ["https://www.publicfirst.co.uk/feed/"]}
    - {name: Verian, url: "https://www.veriangroup.com/", feeds: ["https://www.veriangroup.com/feed/"]}
    - {name: Whitestone Insight, url: "https://www.whitestoneinsight.com/", urls: ["https://whitestoneinsight.com/", "https://www.whitestoneinsight.com/insights", "https://www.whitestoneinsight.com/news"], feeds: ["https://www.whitestoneinsight.com/feed/"]}   # no hyphen (whitestone-insight.com did not resolve)
    - {name: Merlin Strategy, url: "https://merlinstrategy.co.uk/", urls: ["https://merlinstrategy.co.uk/blog"], feeds: ["https://merlinstrategy.co.uk/feed/"]}
    - {name: Stonehaven, url: "https://stonehavenglobal.com/", urls: ["https://stonehavenglobal.com/insights/", "https://stonehavenglobal.com/news/", "https://stonehavenglobal.com/polling/"], feeds: ["https://stonehavenglobal.com/feed/", "https://stonehavenglobal.com/insights/feed/"]}
    - {name: Redfield & Wilton Strategies, url: "https://redfieldandwilton.com/", urls: ["https://redfieldandwilton.com/polls/", "https://redfieldandwilton.com/news/", "https://redfieldandwilton.com/insights/"], feeds: ["https://redfieldandwilton.com/feed/", "https://redfieldandwilton.com/polls/feed/"]}
    - {name: Number Cruncher Politics, url: "https://www.ncpolitics.uk/", feeds: ["https://www.ncpolitics.uk/feed/"]}
    - {name: Stack Data Strategy, url: "https://stackdatastrategy.com/", urls: ["https://stackdatastrategy.com/insights", "https://stackdatastrategy.com/polling", "https://stackdatastrategy.com/blog", "https://stackdatastrategy.com/news", "https://stackdatastrategy.com/research"], feeds: ["https://stackdatastrategy.com/feed/"]}
    - {name: Electoral Calculus, url: "https://www.electoralcalculus.co.uk/", urls: ["https://www.electoralcalculus.co.uk/blog/", "https://www.electoralcalculus.co.uk/polls.html", "https://www.electoralcalculus.co.uk/prediction_main.html"], feeds: ["https://www.electoralcalculus.co.uk/blog/feed.xml", "https://www.electoralcalculus.co.uk/blog/rss.xml"]}
    - {name: Good Growth Foundation, url: "https://www.goodgrowthfoundation.org/", feeds: ["https://www.goodgrowthfoundation.org/feed/"]}
    - {name: Trajectory Partnership, url: "https://www.trajectorypartnership.com/"}
    - {name: Convergent Opinion, url: "https://www.convergentopinion.com/", urls: ["https://convergentopinion.com/", "https://www.convergentopinion.co.uk/", "https://www.convergentopinion.com/blog"], feeds: ["https://www.convergentopinion.com/feed/"]}
    - {name: Peoples Polling, url: "https://www.peoplepolling.com/", urls: ["https://peoplepolling.com/", "https://www.peoplepolling.com/news"], feeds: ["https://www.peoplepolling.com/feed/"]}   # PeoplePolling, one word
    - {name: Yonder, url: "https://yonderconsulting.com/", feeds: ["https://yonderconsulting.com/feed/"]}
    # Panelbase is part of Norstat now (panelbase.net serves Norstat's site), so it is collected under Norstat.
    - {name: Norstat, url: "https://norstat.co.uk/", urls: ["https://norstat.co.uk/insights"], feeds: ["https://norstat.co.uk/feed/"]}
    - {name: WeThink (Omnisis), url: "https://wethink.report/", feeds: ["https://wethink.report/feed/"]}

  # Polling analysts and aggregators: commentary and write-ups of new polls. `require` keeps only poll-related posts.
  analysts:
    - {name: Mark Pack (polling analysis), url: "https://www.markpack.org.uk/category/opinion-polls/", urls: ["https://www.markpack.org.uk/"], feeds: ["https://www.markpack.org.uk/category/opinion-polls/feed/", "https://www.markpack.org.uk/feed/"], require: 'poll|voting intention|survey|MRP|favourab|approval|rating'}
    - {name: Britain Elects (New Statesman), url: "https://www.newstatesman.com/britainelects", feeds: ["https://www.newstatesman.com/britainelects/feed"], require: 'poll|voting intention|MRP|rating|approval|favourab|lead|seats'}
    - {name: Politics.co.uk (polling), url: "https://www.politics.co.uk/", feeds: ["https://www.politics.co.uk/feed/"], require: 'poll|voting intention|MRP|rating|approval'}
    - {name: UK Parliament Commons Library (polling), url: "https://commonslibrary.parliament.uk/", feeds: ["https://commonslibrary.parliament.uk/feed/"], require: 'poll|opinion|survey|voting intention'}

