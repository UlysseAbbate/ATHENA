# How Ulysse categorises items. Everything here is keyword matching on the title + summary (case-insensitive
# regular expressions), plus per-source defaults. It is deliberately simple and transparent: to change how
# something is categorised, edit a pattern here and re-run the collector (old items are re-classified too).
#
# An item gets up to 2 policy areas (highest score) and up to 2 geographies. Scoring: each keyword hit = 1,
# a source/committee default = +2 (strong: +3 for committee names). Items scoring nothing fall into "Other / general".

# Items whose title matches are dropped at collection (staff bios, job adverts, site housekeeping).
drop_title_pattern: '^(associate (director|fellow|policy|researcher|head)|senior (policy|research|communications|digital|fundraising|manager|officer|analyst|advis)|head of|deputy (director|head)|assistant (director|researcher|policy)|director (of|,)|research (fellow|assistant)|policy (analyst|officer|manager)|communications (officer|manager|assistant)|events? (manager|officer)|vacanc|jobs? at|we.re hiring|join (us|our)|not a member|our (team|people|trustees)|about us|contact (us|details)|board changes|new (trustees?|associate fellows?|fellows?)|.*associate fellows.*new additions|welcome to|-\s*liberal democrat voice$)'
# Items whose SUMMARY matches are dropped too (profile pages).
drop_summary_pattern: 'is an independent (think tank|charity|research)|joined .* as a (trainee|senior|research)|is a (senior )?(research|policy) (fellow|analyst|officer)'

areas:
  "Economy & tax":
    - '\b(tax(es|ed|ing|ation)?|budget|fiscal|chancellor|treasury|inflation|economy|economic|growth|productivity|gdp|wealth|debt|borrowing|public finances?|spending review|stagnation|recession|interest rates?|revenue|cost of living|prices?)\b'
  "Business & industry":
    - '\b(business(es)?|industr(y|ial)|trade|invest(ment|ors?)|innovation|compan(y|ies)|corporate|regulat(ion|ory|or)|competition|enterprise|manufactur\w*|financial services|insurance|fca|advertising|startups?|sme|smes|supply chains?|procurement|crypto|screening)\b'
  "Work & skills":
    - '\b(jobs?|employment|employers?|workers?|workforce|wages?|pay (gap|rise)|labour market|unemploy\w*|neets?|training|apprentice\w*|skills?|vocational|working from home|vacancies|good work|world of work|workplace)\b'
  "Welfare & poverty":
    - '\b(welfare|benefits?|poverty|universal credit|(?-i:PIP)|pensions?|pensioners?|triple lock|social security|inequalit(y|ies)|disadvantage[d]?|social mobility|food banks?|deprivation|low[- ]income|child poverty|disabled|disabilit(y|ies)|emergency expense|social class|living standards)\b'
  "Health & social care":
    - '\b(health\w*|nhs|social care|hospitals?|clinical|patients?|(?-i:GPs?)|obesity|mental|medical|doctors?|nurses?|diagnos\w*|cancer|dementia|wellbeing|prevention|public health|ambulance|care homes?|adult social)\b'
  "Education":
    - '\b(schools?|teachers?|pupils?|students?|education|sats|gcse|a-levels?|curriculum|ofsted|inspection|early years|childcare|universit(y|ies)|higher education|hepi|tuition|graduates?|learning|sen(d)?|key stage|attainment|academies)\b'
  "Housing & planning":
    - '\b(housing|homes?|homeless\w*|planning|rents?|renters?|landlords?|mortgages?|house prices?|social housing|tenants?|built environment|new towns?|green belt|high streets?|residential)\b'
  "Local & regional government":
    - '\b(devolution|devolved|councils?|council tax|mayors?|mayoral|local (government|authorit\w*|areas?|leadership|economy|economies)|regional|regions?|strategic authorit\w*|combined authorit\w*|place-based|placemaking|left-behind places|civic|neighbourhoods?|community (wealth|business|ownership|power|empowerment)|levelling up|towns|cities|city regions?)\b'
  "Environment & energy":
    - '\b(energy|climate|net[- ]zero|carbon|nature|biodiversity|water|wildfire|waste|recycling|renewables?|solar|wind|nuclear|gas|oil|emissions|pollution|farming|agricultur\w*|food|environment\w*|throwaway|just transitions?|heat pumps?|energy bills)\b'
  "Transport":
    - '\b(transport\w*|rail|railways?|buses|bus|tfl|aviation|airports?|heathrow|roads|road (safety|pricing|network|building)|cycling|cyclists?|driving|motorists?|fares|trains?|electric vehicles?|evs?|e-bikes?|hs2|tram)\b'
  "Crime, justice & policing":
    - '\b(crime|criminal|police|policing|prisons?|justice|sentenc\w*|courts?|victims?|antisocial|anti-social|offenders?|probation|law and order|knife|violence|shoplifting|fraud|rule of law|human rights|legal)\b'
  "Defence & security":
    - '\b(defence|military|armed forces|nato|security|sanctions|terror\w*|nuclear weapons|army|navy|troops|intelligence|war|warfare|deterrence|geopolitic\w*|hybrid|irgc|espionage|resilience)\b'
  "Foreign affairs":
    - '\b(foreign (policy|affairs|office)|diplomat\w*|international|ukraine|russia\w*|china|chinese|middle east|gaza|israel\w*|iran\w*|hamas|g7|g20|united nations|(?-i:UN)|aid|international development|development (aid|assistance|cooperation|finance)|geoeconomic|trump|sanctions|beyond brexit|belarus\w*|kazakhstan|india|africa\w*|somalia|sahel|asia\w*|indo-pacific|conflict)\b'
  "Europe & Brexit":
    - '\b(eu|europe\w*|brexit|uk-eu|single market|customs union|brussels|ecthr|echr|council of europe|eu membership|reset)\b'
  "Immigration & identity":
    - '\b(immigra\w*|asylum|migrants?|migration|refugees?|border|belonging|integration|race|racism|ethnic\w*|citizenship|identity|nationhood|patriotism|pride|multicultural\w*|diaspora|antisemit\w*|islamophob\w*|hate)\b'
  "Constitution & democracy":
    - '\b(democra\w*|parliament\w*|constitution\w*|elections?|electoral|voting|voters?|lords|commons|standards|accountability|trust in (politics|government)|political (leaders?|system|reform)|referendum|citizens.? assembl\w*|disinformation|legislation|statutory instruments?|delegated powers?|procedure|politicians?|epistemic|information (resilience|ecosystems?)|legitimacy)\b'
  "Technology & digital":
    - '\b((?-i:AI)|artificial intelligence|digital|online|cyber\w*|tech(nology)?|social media|algorithms?|internet|broadband|connectivity|platforms?|robots?|automation|semiconductors?|science|research and development|r&d)\b'
  "Culture, media & society":
    - '\b(culture|cultural|media|creative|arts|music|sport\w*|football|theatre|heritage|museums?|broadcast\w*|bbc|journalism|faith|religio\w*|church|charit(y|ies)|civil society|volunteer\w*|loneliness|women|gender|lgbt\w*)\b'
  "Government & public services":
    - '\b(whitehall|civil service|public services?|public sector|state capacity|rewiring the state|government (reform|efficiency|spending)|reform of the state|public accounts|value for money|nao|auditor|machinery of government|spad|special advisers?|cabinet office)\b'
  "Party politics & polling":
    - '\b(labour|conservatives?|tories|reform uk|lib dems?|liberal democrats?|greens|snp|plaid|poll(s|ing)?|voting intention|parties|party conference|by-election|burnham|badenoch|farage|davey|starmer|favourab\w*|coalition|manifesto)\b'

