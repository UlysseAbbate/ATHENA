# Committee name patterns (+3), matched against the committee name.
committee_areas:
  'health|social care': "Health & social care"
  'defence': "Defence & security"
  'work and pensions': "Welfare & poverty"
  'treasury|economic affairs|finance': "Economy & tax"
  'transport': "Transport"
  'justice|home affairs|crime|police': "Crime, justice & policing"
  'foreign affairs|international relations|international development|international agreements|national security': "Foreign affairs"
  'european|eu ': "Europe & Brexit"
  'environment|energy|net zero|climate|food and rural|agricultur': "Environment & energy"
  'science|technology|communications and digital|ai ': "Technology & digital"
  'culture|media|sport|digital, culture': "Culture, media & society"
  'education|children|skills': "Education"
  'housing|levelling|communities|built environment|planning': "Housing & planning"
  'business|trade|industry|financial services|economic': "Business & industry"
  'constitution|procedure|standards|political and constitutional|house of commons commission|privileges|lords|democracy': "Constitution & democracy"
  'public accounts|public administration|public bill|delegated powers|statutory instruments|secondary legislation|regulatory reform|liaison|public services': "Government & public services"
  'scottish|welsh|northern ireland|devolved|local government': "Local & regional government"
  'immigration|asylum|migration': "Immigration & identity"
  'women|equalit|human rights': "Culture, media & society"

areas_other: "Other / general"

geography:
  # (name, group, patterns). First two matching are kept; no match = "UK-wide / unspecified".
  default: "UK-wide / unspecified"
  places:
    "London":            {group: UK, pattern: '\b(london|tfl|mayor of london|city hall|gla|greater london|londoners?)\b'}
    "Scotland":          {group: UK, pattern: '\b(scotland|scottish|scots|holyrood|edinburgh|glasgow|aberdeen)\b'}
    "Wales":             {group: UK, pattern: '\b(wales|welsh|cardiff|senedd|swansea)\b'}
    "Northern Ireland":  {group: UK, pattern: '\b(northern ireland|belfast|stormont|ulster)\b'}
    "North of England":  {group: UK, pattern: '\b(north east|north west|the north\b|northern england|yorkshire|manchester|liverpool|leeds|newcastle|sheffield|tyne|merseyside|cumbria|lancashire|hull|teesside|rotherham|bradford)\b'}
    "Midlands":          {group: UK, pattern: '\b(midlands|birmingham|nottingham|leicester|coventry|derby|stoke|wolverhampton)\b'}
    "South & East of England": {group: UK, pattern: '\b(south east|south west|east of england|bristol|brighton|kent|essex|oxford|cambridge|cornwall|devon|southampton|portsmouth|norfolk|suffolk|surrey)\b'}
    "England":           {group: UK, pattern: '\b(england|english)\b'}
    "Europe & EU":       {group: International, pattern: '\b(eu|europe\w*|brussels|germany|german|france|french|poland|polish|italy|spain|netherlands|nordic|brexit|uk-eu)\b'}
    "United States":     {group: International, pattern: '\b((?-i:US)|usa|united states|american?s?|america|washington|trump|congress|midterms?|white house)\b'}
    "Russia & Ukraine":  {group: International, pattern: '\b(russia\w*|ukrain\w*|kremlin|putin|belarus\w*|moscow|kyiv|kiev|crimea)\b'}
    "Middle East":       {group: International, pattern: '\b(middle east|gaza|israel\w*|iran\w*|hamas|hormuz|syria\w*|lebanon|yemen|saudi|gulf|tehran|palestin\w*|irgc|houthi)\b'}
    "China & Asia":      {group: International, pattern: '\b(china|chinese|beijing|taiwan|india\w*|japan\w*|asia\w*|indo-pacific|kazakhstan|pakistan|korea\w*|singapore|vietnam)\b'}
    "Africa":            {group: International, pattern: '\b(africa\w*|somalia|sahel|nigeria|kenya|sudan|ethiopia|ghana|south africa|congo)\b'}
    "Global / other":    {group: International, pattern: '\b(global|worldwide|g7|g20|united nations|(?-i:UN)|commonwealth|latin america|brazil\w*|canada|canadian|australia\w*)\b'}
  # committee names that imply a place
  committee_places:
    'scottish': "Scotland"
    'welsh': "Wales"
    'northern ireland': "Northern Ireland"

# Item "type", from the section and keywords in the title.
types:
  committee: {"Special Report": "Special report", "Government Response": "Government response", "Report": "Committee report"}
  media: "News coverage"
  polling: {"voting-intention": "Voting intention", "party-support": "Party support", "news-cycle": "News tracker", default: "Poll / survey"}
  thinktank:
    - ["Response / reaction", '\b(response|responds?|reaction|reacts?|statement|says|call(s)? for|urges?|welcomes?)\b']
    - ["Briefing / data", '\b(tracker|index|briefing|data|figures|statistics|stats|monitor|dashboard|explainer|explains|factsheet|review of the month|\d{4} review|(january|february|march|april|may|june|july|august|september|october|november|december) \d{4} review)\b']
    - ["Report / paper", '\b(report|evaluation|review|commission|inquiry|findings|strategy|agenda|plan|guide|toolkit|paper|case for|blueprint|playbook|manifesto|lessons|evidence|study|analysis)\b']
    - default: "Article / analysis"
